name: Web (mritmo.com)

# Publishes site/ to the "web" branch, with the site at the branch root.
# Hostinger (hPanel → mritmo.com → Avanzado → GIT) deploys that branch to
# public_html, so changing anything in site/ on main updates mritmo.com.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check the site
        run: |
          python3 -m json.tool site/.well-known/assetlinks.json > /dev/null
          test -f site/index.html && test -f site/u/index.html && test -f site/.htaccess

      # The site reads the latest APK's version, size and date from its own /version.json,
      # so visitors never call GitHub's API. Build APK re-runs this flow after each release.
      - name: Write version.json from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/latest" \
            --jq '{version: (.tag_name | ltrimstr("v")), bytes: ([.assets[] | select(.name == "MRitmo.apk") | .size][0] // 0), published: .published_at}' \
            > site/version.json || echo '{}' > site/version.json
          cat site/version.json

      # Hostinger's CDN caches CSS/JS for days: stamp every reference with this commit
      # (style.css?v=__V__ in the HTML) so a deploy is visible right away.
      - name: Stamp asset versions
        run: find site -name '*.html' -exec sed -i "s/__V__/${GITHUB_SHA::7}/g" {} +

      - name: Push site/ to the web branch
        run: |
          cd site
          git init -q -b web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "mritmo.com desde ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" web
          echo "- Rama \`web\` actualizada con \`site/\` (${GITHUB_SHA::7})." >> "$GITHUB_STEP_SUMMARY"
