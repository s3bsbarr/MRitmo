name: Build APK

on:
  push:
    branches: [main]
    # Docs-only commits don't need a new APK.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'supabase/**'
      - '.github/workflows/server.yml'
      - '.github/workflows/bot.yml'
      - '.github/workflows/web.yml'
      - 'site/**'
      - 'tools/site-sprites.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Expo project id for push tokens (Settings → Secrets and variables → Actions → Variables).
      RITMO_EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK; just point Gradle at it.
      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK"

      - name: Install dependencies
        run: npm ci 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Firebase config for push (when the secret is set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            node -e "const j=JSON.parse(require('fs').readFileSync('google-services.json','utf8')); const pk=(j.client||[]).map(c=>c.client_info?.android_client_info?.package_name); if(!pk.includes('com.sebas.ritmo')) { console.error('google-services.json no incluye com.sebas.ritmo: '+pk.join(', ')); process.exit(1) } console.log('Firebase listo para com.sebas.ritmo')"
          else
            echo "::warning::Sin el secreto GOOGLE_SERVICES_JSON: este APK no recibirá notificaciones push del servidor."
          fi
          if [ -z "$RITMO_EXPO_PROJECT_ID" ]; then
            echo "::warning::Sin la variable EXPO_PROJECT_ID: este APK no podrá registrarse para notificaciones push."
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Read the app version
        run: |
          V=$(node -p "require('./app.json').expo.version")
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "MRitmo $V"

      - name: Build only for 64-bit ARM phones (faster build, smaller APK)
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          grep -q '^reactNativeArchitectures=' android/gradle.properties || echo 'reactNativeArchitectures=arm64-v8a' >> android/gradle.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          # Every build gets a higher version so it installs over the previous one.
          sed -i -E "s/versionCode [0-9]+/versionCode $((100 + ${{ github.run_number }}))/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon 2>&1 | tee -a ../build.log; exit ${PIPESTATUS[0]}

      - name: Report the error
        if: failure()
        run: |
          grep -nE "error|Error|FAILURE|What went wrong|Could not|Exception" build.log | tail -40 | while IFS= read -r line; do echo "::error::$line"; done
          tail -25 build.log | while IFS= read -r line; do echo "::error::$line"; done

      - name: Sign with MRitmo's own key (when the secrets are set)
        env:
          RITMO_KEYSTORE_B64: ${{ secrets.RITMO_KEYSTORE_B64 }}
          RITMO_KEYSTORE_PASSWORD: ${{ secrets.RITMO_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p dist
          OUT="dist/MRitmo-$APP_VERSION.apk"
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ -n "$RITMO_KEYSTORE_B64" ] && [ -n "$RITMO_KEYSTORE_PASSWORD" ]; then
            echo "$RITMO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ritmo.jks"
            BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/ritmo.jks" --ks-key-alias ritmo \
              --ks-pass env:RITMO_KEYSTORE_PASSWORD --key-pass env:RITMO_KEYSTORE_PASSWORD \
              --out "$OUT" "$APK"
            "$BT/apksigner" verify --print-certs "$OUT" | head -3
            rm -f "$RUNNER_TEMP/ritmo.jks"
          else
            echo "::warning::Sin llave propia configurada: el APK queda firmado con la llave de pruebas."
            cp "$APK" "$OUT"
          fi
          # Same file under a fixed name: mritmo.com/descargar and the site's button point to
          # releases/latest/download/MRitmo.apk, so they always serve the newest version.
          cp "$OUT" dist/MRitmo.apk
          ls -lh dist

      - uses: actions/upload-artifact@v5
        with:
          name: MRitmo-${{ env.APP_VERSION }}
          path: dist/*.apk

      # One release per version (v1.2, v1.3…). Pushing again with the same
      # version replaces that release's APK instead of creating a new one.
      - name: Point the version tag at this build
        run: |
          git tag -f "v$APP_VERSION"
          git push -f origin "v$APP_VERSION"

      - name: Publish as a release (direct download from the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: MRitmo ${{ env.APP_VERSION }}
          body: |
            Abre este enlace desde el celular, descarga el APK e instálalo encima de la versión anterior.
            También se descarga siempre la última versión desde https://mritmo.com/descargar ("MRitmo.apk" es el mismo archivo que "MRitmo-${{ env.APP_VERSION }}.apk").
          files: dist/*.apk
          make_latest: true
          overwrite_files: true
