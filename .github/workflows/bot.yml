name: Amigo bot

# A second account (@amigobot) to test everything about friends from one phone.
# Run it from the GitHub app: Actions → Amigo bot → Run workflow.
#
#   preparar   creates the bot (once), 7 days of history, and sends you a request
#   solicitud  the bot sends you a new request (to test that notification again)
#   avanzar    +30 min to the bot's day and 25 min in focus
#   completar  the bot finishes its day (100 %)
#   quitar     removes the friendship (add @amigobot from the app: it accepts by itself)
#   habito     the bot invites you to a shared habit (title in "usuario", optional)
#   marcar     the bot marks its shared habits today ("Amigo Bot ya marcó, faltas tú")
#   sala       the bot creates a room and invites you (room name in "usuario", optional)
#   ocultar    the bot hides (or shows again) its progress: "Avance oculto" on your board (1.9)
#   bloquear   the bot blocks you (or unblocks you): it disappears from your board and search (1.9)
#   borrar     deletes the bot's account like "Eliminar cuenta" (1.9); "preparar" creates it again
#   estado     the bot's last days and the last notifications sent
#
# Its progress also moves by itself every minute from 7:00 to 21:00 (Bogotá).
# It accepts shared-habit and room invites by itself and marks its habits during the day.

on:
  workflow_dispatch:
    inputs:
      accion:
        description: Qué hacer
        type: choice
        default: estado
        options: [preparar, solicitud, avanzar, completar, quitar, habito, marcar, sala, ocultar, bloquear, borrar, estado]
      usuario:
        description: Tu @usuario (para "preparar"), el título del hábito ("habito") o el nombre de la sala ("sala")
        type: string
        required: false

env:
  SUPABASE_PROJECT_REF: qehkinjwkpfmmmyxqjxm

jobs:
  bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Supabase client (only to create or delete the bot's account)
        if: inputs.accion == 'preparar' || inputs.accion == 'borrar'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ACCION: ${{ inputs.accion }}
          USUARIO: ${{ inputs.usuario }}
        run: node supabase/scripts/server.mjs bot "$ACCION" "$USUARIO"
