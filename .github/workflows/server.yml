name: Servidor (Supabase)

# Applies database migrations, uploads the account emails (Spanish templates
# and SMTP) and deploys the Edge Functions. Runs by itself when anything in
# supabase/ changes on main; also runnable by hand from the Actions tab.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  required · supabase.com/dashboard/account/tokens
#   SMTP_USER, SMTP_PASS   the app's Gmail and its 16-letter app password
#   SMTP_HOST, SMTP_PORT, SMTP_FROM, SMTP_SENDER_NAME   optional (when moving to a domain)
#   EXPO_ACCESS_TOKEN      optional · only if "enhanced push security" is turned on in Expo

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

concurrency:
  group: server
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: qehkinjwkpfmmmyxqjxm

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the access token
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta el secreto SUPABASE_ACCESS_TOKEN. El servidor no se actualizó."
            echo "Falta el secreto **SUPABASE_ACCESS_TOKEN**. El servidor no se actualizó." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Database migrations
        if: steps.token.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node supabase/scripts/server.mjs migrate

      - name: Account emails and redirects
        if: steps.token.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_SENDER_NAME: ${{ secrets.SMTP_SENDER_NAME }}
        run: node supabase/scripts/server.mjs auth

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with:
          version: latest

      - name: Edge Functions
        if: steps.token.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
        run: |
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
            echo "- Función desplegada: \`$fn\`" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ -n "$EXPO_ACCESS_TOKEN" ]; then
            supabase secrets set EXPO_ACCESS_TOKEN="$EXPO_ACCESS_TOKEN" --project-ref "$SUPABASE_PROJECT_REF"
          fi
